<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#F8FAFC" />
    <meta name="description" content="StudyOS — Personal Learning & Research Workspace" />
    <title>StudyOS · Personal Learning &amp; Research Workspace</title>
  </head>
  <body>
    <div id="root"></div>
    <script>
      (() => {
        try {
          const preference = localStorage.getItem('studyos-theme') || 'system'
          const useDark = preference === 'dark' ||
            (preference === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches)
          document.documentElement.classList.toggle('dark', useDark)
          document.documentElement.style.colorScheme = useDark ? 'dark' : 'light'
        } catch {
          // The React theme provider applies the default if browser storage is unavailable.
        }
      })()
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
